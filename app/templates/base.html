<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name if app_name else 'Chatbot' }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Outfit", "sans-serif"] },
            colors: {
              gemini: {
                mainBg: "#0e0e11",
                sidebarBg: "#131314",
                barBg: "#1e1f20",
                hoverBg: "#282a2c",
                textActive: "#e3e3e3",
                textMuted: "#9e9e9e",
                bluePulse: "#1a73e8",
              },
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/chat.css') }}"
    />
  </head>
  <body
    class="bg-gemini-mainBg text-gemini-textActive font-sans h-screen flex overflow-hidden"
  >
    {% block body %}{% endblock %}
    <script>
      window.APP_CONFIG = {
        apiUrl: "/api/chat",
        userName: "{{ user_name|default('LexBen') }}",
        appName: "{{ app_name|default('Gemini') }}",
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
  </body>
</html>
